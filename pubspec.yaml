name: parking1
description: "A Smart Parking System with Real-time Booking and Billing."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.1
  intl: ^0.19.0

  # Firebase
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.1
  firebase_storage: ^12.4.10

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # UI & Utilities
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  image_picker: ^1.0.7
  video_player: ^2.8.1
  lottie: ^3.1.2
  font_awesome_flutter: ^10.7.0
  permission_handler: ^11.3.1

  # QR & Scanning
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.0

  # Revenue & Reports
  fl_chart: ^0.70.2
  pdf: ^3.11.1
  printing: ^5.13.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/videos/parking_bg.mp4
    - assets/bg.jpg
    - assets/parking_header.jpg
    - assets/bg1.webp
    - assets/bg2.webp
    - assets/b4.jpg